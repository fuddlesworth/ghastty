<?xml version="1.0" encoding="UTF-8"?>
<!-- V5: Standalone tall ghost, no CRT bezel — matched to upstream
     Ghostty's ghost-only icon while keeping ghastty's own identity:
     cream body, red `>_` prompt eyes + mouth, wavy feet, red face glow.

     Feet: rounded toes with crisp cusp valleys. Each toe is one cubic
     with vertical control handles (controls straight below the two
     valley endpoints), so the valleys stay pointed AND the end toes meet
     the side walls with a vertical tangent — the bottom corners round
     off instead of kinking like the old Q-scallops did. (An earlier
     smooth-wave version rounded the valleys too and read as a sine wave.)

     Face is not flat: glyphs use a top-lit red gradient with a subtle
     emboss shadow, the cursor block is rounded, and the mouth is a
     rounded pill rather than a plain square.

     Proportions matched to upstream's solid body (319x387, h/w 1.213):
     body 604 wide x 732 tall, centered at x=512, dome apex y=121, feet
     bottom ~y=832. Dark outline + soft outer glow keep it legible on light
     desktop panels (no bezel to frame it).

     The viewBox tightly frames the ghost (centered on 512,477 with a ~50px
     margin for the outer glow) instead of using the full 1024 artwork
     canvas, so the ghost fills ~88% of the rendered icon and matches the
     visual weight of neighbouring taskbar icons. Paths/gradients are in the
     original user space; only the viewBox window changed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="106 71 812 812">
  <defs>
    <linearGradient id="ghostBody" gradientUnits="userSpaceOnUse"
                    x1="512" y1="121" x2="512" y2="853">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="0.55" stop-color="#e3ddd0"/>
      <stop offset="1" stop-color="#a89fa8"/>
    </linearGradient>
    <!-- Top-lit red for the glyphs so they read as raised, not flat. -->
    <linearGradient id="promptRed" gradientUnits="userSpaceOnUse"
                    x1="512" y1="440" x2="512" y2="690">
      <stop offset="0" stop-color="#ff5a45"/>
      <stop offset="1" stop-color="#d11f1f"/>
    </linearGradient>
    <!-- Red face glow: warm bloom behind the prompt and the mouth. -->
    <radialGradient id="mouthGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4838" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#ff4838" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft outer glow so the pale ghost separates from light backgrounds. -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14"
                    flood-color="#0a0c14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dome ghost: rounded top (radius 302) + straight sides + a smooth
       4-toe wave at the bottom. Centered on x=512; body x=210..814,
       y=121..853. The bottom wave's end segments leave the walls with a
       vertical tangent (controls at x=814 / x=210), rounding the corners. -->
  <g filter="url(#outerGlow)">
    <path id="bodyPath" d="
      M 210 783
      L 210 423
      A 302 302 0 0 1 814 423
      L 814 783
      C 814 848 663 848 663 783
      C 663 848 512 848 512 783
      C 512 848 361 848 361 783
      C 361 848 210 848 210 783 Z
    " fill="url(#ghostBody)"/>
    <use href="#bodyPath" fill="none" stroke="#0a0c14" stroke-opacity="0.55"
         stroke-width="15" stroke-linejoin="round"/>
  </g>

  <!-- Red face glow, within the body. -->
  <ellipse cx="512" cy="488" rx="250" ry="115" fill="url(#mouthGlow)"/>
  <ellipse cx="512" cy="651" rx="85" ry="50" fill="url(#mouthGlow)"/>

  <!-- Emboss: darker copies offset down a few px so the glyphs get a
       raised lip (light from above). -->
  <g fill="#8f1414" stroke="#8f1414" opacity="0.5">
    <path d="M 328 431 L 432 493 L 328 555" fill="none" stroke-width="45"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="541" y="464" width="155" height="59" rx="20"/>
    <rect x="477" y="636" width="70" height="40" rx="20"/>
  </g>

  <!-- > _ prompt eyes (chevron x=328..432 apex 432, cursor x=541..696,
       vertical center y=488) and a rounded-pill mouth below (~72% down). -->
  <path d="M 328 426 L 432 488 L 328 550" fill="none" stroke="url(#promptRed)"
        stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="541" y="459" width="155" height="59" rx="20" fill="url(#promptRed)"/>
  <rect x="477" y="631" width="70" height="40" rx="20" fill="url(#promptRed)"/>
</svg>
